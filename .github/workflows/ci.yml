name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install Python deps
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with:
          node-version: "22"
      - name: DSH bridge
        if: runner.os != 'Windows'
        run: node extras/dsh/test-bridge.mjs && node extras/dsh/test-apply.mjs
      - name: JavaScript client against the real server (stdio and HTTP)
        if: runner.os != 'Windows'
        run: node --test sdk/js/test/krouter.test.js
      - name: First run
        if: runner.os != 'Windows'
        run: ./scripts/first_run.sh
      - name: One-line install, dry run
        run: python scripts/bootstrap.py --dry-run --lang en --vault ci-vault

  integrations:
    # 第三方客户端：官方 MCP Python SDK（stdio 和 HTTP）、LlamaIndex 检索器、Kubernetes 清单的结构
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the clients
        run: python -m pip install -r requirements-dev.txt "mcp>=1.27" "llama-index-core>=0.14" pyyaml
      - name: Official MCP SDK, LlamaIndex, deployment files
        run: python -m pytest -q tests/test_mcp_official_sdk.py tests/test_sdk_llamaindex.py tests/test_deploy.py

  frameworks:
    # docs/FRAMEWORKS.md 里每个框架各装在自己的环境里，照那页的写法连 KRouter 的服务（不调模型、不要 key）
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: langchain, pip: "langchain-mcp-adapters langchain langgraph"}
          - {name: openai_agents, pip: "openai-agents"}
          - {name: pydantic_ai, pip: "pydantic-ai-slim[mcp] fastmcp"}
          - {name: google_adk, pip: "google-adk"}
          - {name: crewai, pip: "crewai"}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ${{ matrix.name }}
        run: python -m pip install -r requirements-dev.txt ${{ matrix.pip }}
      - name: ${{ matrix.name }} against the server
        env:
          KROUTER_REQUIRE_FRAMEWORKS: "1"
        run: python -m pytest -q tests/test_frameworks.py -k ${{ matrix.name }}

  langgraph-store:
    # krouter.integrations.langgraph：从本仓库装 krouter[langgraph]，在支持范围的两端各跑一遍（不调模型、不要 key）
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: lowest, pin: "langgraph==1.0.0 langgraph-checkpoint==2.1.0"}
          - {name: latest, pin: ""}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install krouter[langgraph] (${{ matrix.name }})
        run: python -m pip install -r requirements-dev.txt ".[langgraph]" ${{ matrix.pin }}
      - name: Store tests
        env:
          KROUTER_REQUIRE_LANGGRAPH: "1"
          KROUTER_NO_QUERY_LOG: "1"
        run: python -m pytest -q tests/test_langgraph_store.py
      - name: The example, from the installed package
        working-directory: ${{ runner.temp }}
        env:
          KROUTER_NO_QUERY_LOG: "1"
        run: python -m krouter.integrations.langgraph_demo

  vercel-ai-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vercel AI SDK against the server
        working-directory: tests/frameworks/vercel
        run: npm install --no-audit --no-fund && npm test

  docker:
    # 团队服务器镜像：每个 PR 都构建一次并跑冒烟测试（不推送；推送只在发版时）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the team-server image
        run: docker build -t krouter:ci .
      - name: Smoke test (health, token, labelled receipt, hashed log, read-only vault, not root)
        run: sh scripts/docker_smoke.sh krouter:ci
