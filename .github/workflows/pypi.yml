name: pypi

# `pip install krouter-memory` (the name `krouter` was taken on PyPI): every published release goes to PyPI through Trusted Publishing (no token stored anywhere;
# PyPI trusts this workflow's GitHub identity). The PyPI side, once, by the maintainer: pypi.org → Your projects →
# Publishing → add a pending publisher: owner 398894496-arch, repository KRouter, workflow pypi.yml, environment pypi.
# A release published before that is configured fails here and nowhere else; run this workflow by hand with its tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "the release tag to publish, e.g. v2.2.0"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: python -m pip install build==1.2.2 && python -m build
      - name: The package says the tag's version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ls dist
          test -f "dist/krouter_memory-${TAG#v}-py3-none-any.whl" || { echo "dist has no krouter_memory-${TAG#v} wheel"; exit 1; }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
