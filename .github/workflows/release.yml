name: release-assets

# Every published release gets the installable package and its checksum, so the one-line install
# (scripts/bootstrap.sh / bootstrap.ps1) downloads a fixed, verifiable file instead of a git checkout.
on:
  release:
    types: [published]

permissions:
  contents: write
  # 构建来源证明：由 GitHub 的工作流身份签名，不和安装包放在一起，`gh attestation verify` 可查
  id-token: write
  attestations: write
  # 团队服务器镜像推到 GHCR
  packages: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The tag, the version files and the changelog agree
        # 发出去的包、状态块和更新日志说的必须是同一个版本；Unreleased 里还有东西就说明有改动没写进这个版本
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'CHECK'
          import json, os, re, sys
          tag = os.environ["TAG"].lstrip("v")
          versions = {f: json.load(open(f))["version"] for f in ("package.json", ".claude-plugin/plugin.json", "extras/dsh/package.json")}
          log = open("CHANGELOG.md", encoding="utf-8").read()
          unreleased = log.split("## Unreleased", 1)[1].split("\n## ", 1)[0].strip()
          problems = [f"{f} says {v}" for f, v in versions.items() if v != tag]
          problems += [] if re.search(rf"(?m)^## {re.escape(tag)} — ", log) else [f"CHANGELOG.md has no '## {tag} — ' heading"]
          problems += [] if unreleased in ("", "Nothing yet.") else ["CHANGELOG.md still lists changes under Unreleased"]
          problems += [] if f"v{tag}" in open("docs/STATUS.md", encoding="utf-8").read() else [f"docs/STATUS.md does not name v{tag}"]
          if problems:
              sys.exit("release v" + tag + " refused: " + "; ".join(problems))
          print("release v" + tag + ": versions, changelog and status block agree")
          CHECK
      - name: Pack and checksum
        run: |
          npm pack
          cp scripts/bootstrap.sh scripts/bootstrap.ps1 .   # 一行安装从 releases/latest/download/ 取这两个，不取 main 上的
          sha256sum dsh-krouter-*.tgz bootstrap.sh bootstrap.ps1 > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dsh-krouter-*.tgz
            bootstrap.sh
            bootstrap.ps1
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dsh-krouter-*.tgz bootstrap.sh bootstrap.ps1 SHA256SUMS --clobber

  image:
    # 团队服务器镜像：版本检查通过后才构建；冒烟测试过了才推送；镜像本身也带构建来源证明
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Build
        run: docker build -t krouter:release .
      - name: Smoke test
        run: sh scripts/docker_smoke.sh krouter:release
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push
        id: push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          IMG=ghcr.io/398894496-arch/krouter
          docker tag krouter:release "$IMG:$TAG"
          docker tag krouter:release "$IMG:latest"
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMG:$TAG" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - name: Attest the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/398894496-arch/krouter
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
